<!doctype html>
<html lang="en" data-exo-theme="void">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exo Cinema</title>
  <link rel="stylesheet" href="glass.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="boot.css">
  <link rel="icon" href="favicon.svg">
</head>
<body class="mode-app">
  <!-- The opening: the page's first frame, so it is drawn before any script runs (boot.js plays it, app.js lifts it
       once the first screen is ready). -->
  <div class="exo-boot" id="boot" role="status" aria-label="Opening Exo Cinema">
    <img class="exo-boot-icon" src="logo.svg" width="128" height="128" alt="" draggable="false" decoding="sync">
  </div>

  <div id="app">
    <!-- The Bar, as Exo Launcher's (TitleBar.tsx): Search (Ctrl+K), the libraries, and Tools with the window controls. -->
    <header class="bar">
      <button class="exo-glass bar-search" id="openSearch" type="button" aria-label="Search" aria-keyshortcuts="Control+K">
        <img class="bar-mark" src="mark.svg" width="20" height="20" alt="" draggable="false"><span>Search</span>
      </button>
      <nav class="exo-glass rooms" id="rooms" aria-label="Libraries"></nav>
      <div class="exo-glass tools">
        <button class="tool-btn profile-btn" id="profileBtn" type="button" aria-label="Account" aria-haspopup="menu"><span class="avatar" id="avatar"></span></button>
        <span class="window-controls" data-window-controls></span>
      </div>
    </header>
    <div class="exo-glass is-panel is-menu menu" id="settingsMenu" role="menu" hidden>
      <div class="menu-who" id="accountWho"></div>
      <button role="menuitem" class="menu-row" data-app="settings"><svg data-glyph="settings"></svg>Settings</button>
      <button role="menuitem" class="menu-row" data-app="sign-out"><svg data-glyph="door-exit"></svg>Sign out</button>
    </div>
    <main id="view" tabindex="-1"></main>
  </div>

  <!-- Ctrl+K: search everything on the server. -->
  <div class="palette" id="palette" hidden>
    <div class="palette-scrim" data-close-palette></div>
    <div class="exo-glass is-panel palette-panel" role="dialog" aria-label="Search">
      <label class="palette-field"><svg data-glyph="search"></svg><input id="paletteInput" type="search" placeholder="Search" autocomplete="off" spellcheck="false" role="combobox" aria-controls="paletteResults"></label>
      <div class="palette-results" id="paletteResults" role="listbox"></div>
    </div>
  </div>

  <section id="signin" hidden>
    <header class="signin-bar">
      <div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div>
    </header>
    <form class="exo-glass is-panel sheet" id="signinForm" autocomplete="on">
      <img class="sheet-mark" src="logo.svg" alt="">
      <h1>Jellyfin</h1>
      <label class="field">
        <span>Server</span>
        <input class="exo-field" name="server" id="server" inputmode="url" placeholder="jellyfin.example.com" required spellcheck="false" autocapitalize="off">
      </label>
      <div class="server-found" id="serverFound" hidden></div>
      <label class="field">
        <span>Username</span>
        <input class="exo-field" name="username" id="username" autocomplete="username" required spellcheck="false" autocapitalize="off">
      </label>
      <label class="field">
        <span>Password</span>
        <input class="exo-field" name="password" id="password" type="password" autocomplete="current-password">
      </label>
      <p class="form-error" id="signinError" role="alert" hidden></p>
      <button class="primary is-primary wide" type="submit" id="signinButton">Sign in</button>
      <button class="secondary wide" type="button" id="quickConnect" hidden>Use Quick Connect</button>
      <p class="quick-code" id="quickCode" hidden></p>
    </form>
  </section>

  <!-- The first run (onboarding.js): Welcome, Jellyfin, Playback and Your look, as Exo Launcher's. -->
  <section class="ob" id="onboarding" hidden>
    <header class="ob-band">
      <div class="exo-glass capsule tools-capsule"><span class="window-controls" data-window-controls></span></div>
    </header>
    <div class="ob-column">
      <div class="ob-progress" id="obProgress" role="progressbar" aria-label="Setup" aria-valuemin="0" aria-valuemax="3"><span></span></div>
      <div class="ob-step" id="obStep"></div>
      <footer class="ob-foot">
        <p class="ob-note" id="obNote" role="status"></p>
        <button type="button" class="ob-back" id="obBack">Back</button>
        <button type="button" class="primary is-primary ob-cta" id="obNext">Get started</button>
      </footer>
    </div>
  </section>

  <!-- What's New, after an update and from Settings › About (updates.js). -->
  <div class="whats-new" id="whatsNew" hidden>
    <div class="whats-new-scrim" data-close-whats-new></div>
    <section class="exo-glass is-panel whats-new-sheet" role="dialog" aria-modal="true" aria-labelledby="whatsNewTitle">
      <h2 id="whatsNewTitle"></h2>
      <div class="whats-new-list" id="whatsNewList"></div>
      <footer class="whats-new-foot">
        <button type="button" class="primary is-primary" id="whatsNewContinue">Continue</button>
        <button type="button" class="primary is-primary" id="whatsNewInstall" hidden>Install update</button>
      </footer>
    </section>
  </div>

  <main id="stage">
    <header class="top">
      <div class="exo-glass is-over-art capsule title-capsule" data-over-video>
        <button class="icon" data-action="back" aria-label="Back"><svg data-glyph="chevron-left"></svg></button>
        <span id="title"></span>
      </div>
      <div class="exo-glass is-over-art capsule tools" data-over-video>
        <button class="icon" data-action="tracks" aria-label="Audio, subtitles and speed" aria-haspopup="menu"><svg data-glyph="adjustments-horizontal"></svg></button>
        <button class="icon" data-action="info" aria-label="Details"><svg data-glyph="info"></svg></button>
        <button class="icon" data-action="fullscreen" aria-label="Full screen"><svg data-glyph="arrows-maximize"></svg></button>
        <span class="window-controls" data-window-controls></span>
      </div>
    </header>

    <footer class="exo-glass is-over-art controls" data-over-video>
      <button class="play is-primary" data-action="pause" aria-label="Play"><svg data-glyph="player-play-filled"></svg></button>
      <span class="time" id="pos">0:00</span>
      <div class="scrub" id="scrub" role="slider" aria-label="Position" tabindex="0">
        <div class="track"><div class="cached" id="cached"></div><div class="played" id="played"></div></div>
        <div class="thumb" id="thumb"></div>
        <div class="exo-glass is-over-art hover-time" id="hoverTime" data-over-video></div>
      </div>
      <span class="time" id="dur">0:00</span>
      <div class="volume" role="group" aria-label="Volume">
        <button class="icon" data-action="mute" aria-label="Mute"><svg data-glyph="volume"></svg></button>
        <input type="range" class="is-compact" id="volume" min="0" max="100" step="1" value="100" aria-label="Volume" aria-valuetext="100 percent">
      </div>
    </footer>

    <aside class="exo-glass is-panel readings" id="readings" data-over-video hidden></aside>
    <div class="exo-glass is-panel track-menu" id="trackMenu" data-over-video role="menu" hidden></div>
    <button class="exo-glass is-over-art skip-btn" id="skipBtn" data-over-video type="button" hidden><span></span><svg data-glyph="player-skip-forward-filled"></svg></button>
    <div class="exo-glass is-panel up-next" id="upNext" data-over-video hidden></div>
    <div class="spinner" id="spinner" hidden></div>
  </main>

  <script src="boot.js"></script>
  <script src="icons.js"></script>
  <script src="player.js"></script>
  <script src="window.js"></script>
  <script src="app.js"></script>
  <script src="onboarding.js"></script>
  <script src="updates.js"></script>
  <script src="playerplus.js"></script>
</body>
</html>
